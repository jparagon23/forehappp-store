spring.application.name=store
spring.config.import=optional:env.properties
server.port=${PORT:8081}

# =====================
# DATABASE (shared con appointment)
# =====================
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# =====================
# JPA
# =====================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:store-schema.sql
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =====================
# VIRTUAL THREADS
# =====================
spring.threads.virtual.enabled=true

# =====================
# CACHE (Caffeine) — specs configured in CacheConfig.java
# =====================
spring.cache.type=caffeine


# =====================
# JWT  — secret DISTINTO al de appointment
# =====================
store.jwt.secret=${STORE_JWT_SECRET}
access.token.validity.seconds=${ACCESS_TOKEN_EXPIRATION:86400}
refresh.token.validity.seconds=${REFRESH_TOKEN_EXPIRATION:604800}

# =====================
# PAYMENTS (MercadoPago)
# =====================
mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN}
mercadopago.webhook.secret=${MERCADOPAGO_WEBHOOK_SECRET}
app.payment.currency=COP
app.payment.mercado-pago-surcharge-rate=0.035
app.payment.back-url.success=${PAYMENT_SUCCESS_URL:http://localhost:3000/orders/success}
app.payment.back-url.failure=${PAYMENT_FAILURE_URL:http://localhost:3000/orders/failure}
app.payment.back-url.pending=${PAYMENT_PENDING_URL:http://localhost:3000/orders/pending}
app.payment.notification-url=${PAYMENT_NOTIFICATION_URL:}

# =====================
# INVENTORY ALERTS
# =====================
app.inventory.low-stock-threshold=${LOW_STOCK_THRESHOLD:5}

# =====================
# REPURCHASE REMINDERS
# =====================
# Off by default: turn on once sellers have filled repurchase days on their products
app.repurchase.enabled=${REPURCHASE_REMINDERS_ENABLED:false}
# Daily at 10:00 (America/Bogota)
app.repurchase.cron=0 0 10 * * *
# Send once this fraction of the estimated duration has elapsed
app.repurchase.send-ratio=0.8
# A reminder whose send date passed more than this many days ago is dropped, not sent late
app.repurchase.late-window-days=7
app.repurchase.min-days-between-emails=30
# Stop reminding a buyer after this many reminders without a new purchase
app.repurchase.max-ignored-reminders=2
app.repurchase.max-duration-days=365
# Used as delivery date when the seller shipped but never marked the group as delivered
app.repurchase.shipped-fallback-days=3
app.repurchase.unsubscribe-secret=${REPURCHASE_UNSUBSCRIBE_SECRET:${STORE_JWT_SECRET}}
app.repurchase.product-path=/product/{productId}
app.repurchase.unsubscribe-path=/email/unsubscribe

# =====================
# FRONTEND
# =====================
app.frontend.url=${FRONTEND_URL:http://localhost:3000}

# =====================
# EMAIL
# =====================
# Provider: mock | smtp | mailersend
app.email.provider=${EMAIL_PROVIDER:mock}
app.mail.fromName=${MAIL_FROM_NAME:Forehapp Store}

# MailerSend
mailersend.apiKey=${MAILERSEND_API_KEY:}
mailersend.fromEmail=${MAILERSEND_FROM_EMAIL:}
mailersend.fromName=${MAILERSEND_FROM_NAME:Forehapp Store}

# SMTP
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.enable=false

# =====================
# PUSH (VAPID)
# =====================
push.vapid.publicKey=${VAPID_PUBLIC_KEY}
push.vapid.privateKey=${VAPID_PRIVATE_KEY}
push.vapid.subject=mailto:${MAILERSEND_FROM_EMAIL}

# =====================
# FCM
# =====================
fcm.service-account-json=${FCM_SERVICE_ACCOUNT_JSON:}

# =====================
# GOOGLE OAUTH
# =====================
google.client-id=${GOOGLE_CLIENT_ID}

# =====================
# ERROR ALERTS
# =====================
app.alert.admin-emails=${ALERT_ADMIN_EMAILS:jparagon2021@gmail.com,saa147@gmail.com}

# =====================
# INTERNATIONALIZACION
# =====================
app.default-language=es

# =====================
# CORS
# =====================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# =====================
# MULTIPART
# =====================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB

# (storage reads AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_ENDPOINT_URL /
#  AWS_S3_BUCKET_NAME / AWS_DEFAULT_REGION / STORAGE_PUBLIC_URL / STORAGE_PATH_STYLE directly)
